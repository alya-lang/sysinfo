[package]
name = "sysinfo"
version = "0.1.0"
alya-version = "0.0.19"
entry = "src/lib.alya"
description = "Cross-platform system information: OS, CPU, memory, disk, host, timezone, power, process, env, load, and locale for Alya"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
license = "MIT"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/sysinfo"
keywords = ["alya", "alya-lang", "package", "sysinfo", "locale", "system", "cpu", "memory", "hardware", "i18n", "c", "ffi"]

[dependencies]

[build]
c-sources = ["c/sysinfo.c"]
c-sources-windows = ["c/win32_locale.c", "c/win32_sysinfo.c"]
c-sources-macos = ["c/cocoa_locale.c", "c/cocoa_sysinfo.c"]
c-sources-linux = ["c/linux_locale.c", "c/linux_sysinfo.c"]
c-flags = ["-O2"]
c-include-dirs = ["c"]
c-link-flags-windows = ["-ladvapi32"]
c-link-flags-macos = ["-framework", "CoreFoundation", "-framework", "Foundation", "-framework", "IOKit"]
links = "sysinfo"

